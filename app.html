<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b8fd6">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-512.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>SallPro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: sky-blue sidebar app shell (Pipedrive-like). Today = sessions + plan checklists; kanban for fees and prospects; week grid; automatic WhatsApp message log */
:root{
  --sky:#0b8fd6; --sky-d:#0873ad; --sky-soft:#e3f4fd; --pale:#f4faff;
  --bg:#f4faff; --surface:#ffffff; --line:#d7e9f5; --fg:#0c2a3e; --muted:#587389;
  --ok:#14915a; --ok-soft:#e3f6ec; --bad:#d23b3b; --bad-soft:#fde8e8; --warn:#b7790a; --warn-soft:#fff3dc; --wa:#1fa855; --wa-bub:#dcf8c6;
  --side:#0b8fd6; --side-fg:#ffffff; --side-mut:#d4ecfb;
  --f-d:"Barlow Condensed","Arial Narrow",sans-serif; --f-b:"Manrope","Segoe UI",system-ui,sans-serif; --f-a:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#38bdf8;--sky-d:#7dd3fc;--sky-soft:#0d2e44;--pale:#0b1f2e;--bg:#06141f;--surface:#0b1f2e;--line:#173449;--fg:#e6f4fc;--muted:#8fb0c6;--ok:#3ccf8a;--ok-soft:#0f2e22;--bad:#ff6b6b;--bad-soft:#3a1618;--warn:#f2b441;--warn-soft:#33270b;--wa-bub:#173d2a;--side:#0a3a57;--side-mut:#9fc7df;color-scheme:dark}}
:root[data-theme="dark"]{--sky:#38bdf8;--sky-d:#7dd3fc;--sky-soft:#0d2e44;--pale:#0b1f2e;--bg:#06141f;--surface:#0b1f2e;--line:#173449;--fg:#e6f4fc;--muted:#8fb0c6;--ok:#3ccf8a;--ok-soft:#0f2e22;--bad:#ff6b6b;--bad-soft:#3a1618;--warn:#f2b441;--warn-soft:#33270b;--wa-bub:#173d2a;--side:#0a3a57;--side-mut:#9fc7df;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:14px;line-height:1.5}
[dir="rtl"] body,[dir="rtl"] button,[dir="rtl"] input,[dir="rtl"] select{font-family:var(--f-a)}
button,input,select{font:inherit;color:inherit}
a{color:var(--sky)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#root{height:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--surface);color:var(--fg);white-space:nowrap}
.btn:hover{filter:brightness(1.04)}
.btn-p{background:var(--sky);border-color:var(--sky);color:#fff}
.btn-g{background:var(--wa);border-color:var(--wa);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-ghost{background:transparent;border-color:#ffffff55;color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-sky{background:var(--sky-soft);color:var(--sky-d)}
.belt{display:inline-block;width:24px;height:8px;border-radius:2px;border:1px solid #00000022;vertical-align:middle}
.fld{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.fld input,.fld select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 12px;width:100%}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.note{color:var(--muted);font-size:12px}
.mark{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;flex:none}
.mark i{display:block;width:19px;height:5px;border-radius:2px;background:#0c2a3e;box-shadow:0 -6px 0 #0b8fd6,0 6px 0 #0b8fd6}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-weight:800;font-size:26px;color:#fff}
.auth{min-height:100%;background:#0b8fd6;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);color:var(--fg);border-radius:18px;padding:28px;width:100%;max-width:440px;box-shadow:0 30px 60px #04324f40}
.card.wide{max-width:720px}
.card h2{margin:0 0 4px;font-family:var(--f-d);font-size:28px;text-wrap:balance;text-transform:uppercase;line-height:1.1}
[dir="rtl"] .card h2{font-family:var(--f-a);text-transform:none;font-size:26px}
.card .logo{color:var(--fg);margin-bottom:16px}.card .mark{background:var(--sky)}.card .mark i{box-shadow:0 -6px 0 #fff,0 6px 0 #fff}
.steps{display:flex;gap:6px;margin:0 0 18px}.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps span.on{background:var(--sky)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:6px}
.choice.on{border-color:var(--sky);background:var(--sky-soft)}
.choice b{font-size:15px}.choice span{color:var(--muted);font-size:12px}
.choice .ic{font-size:26px;line-height:1}
.card.wide{max-height:none}
.row-end{display:flex;justify-content:space-between;gap:8px;margin-top:20px;flex-wrap:wrap}
.langsw{display:flex;gap:4px}.langsw button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 9px;cursor:pointer;font-weight:700;font-size:12px}.langsw button.on{background:var(--sky);color:#fff;border-color:var(--sky)}
.app{display:grid;grid-template-columns:236px 1fr;height:100%}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:3px;padding:16px 12px;overflow-y:auto}
.side .logo{padding:0 6px 16px}
.club{background:#ffffff1f;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.club b{display:block}.club span{font-size:12px;color:var(--side-mut)}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;border:0;background:transparent;color:var(--side-fg);cursor:pointer;font-weight:700;text-align:start;width:100%}
.nav-i svg{width:18px;height:18px;flex:none}
.nav-i:hover{background:#ffffff1a}
.nav-i.on{background:#fff;color:#0873ad}
:root[data-theme="dark"] .nav-i.on{background:var(--sky);color:#06141f}
.nav-i .cnt{margin-inline-start:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 7px}
.side-foot{margin-top:auto;display:flex;gap:6px;padding-top:12px;border-top:1px solid #ffffff2a}
.side-foot .btn{flex:1}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar h1{margin:0;font-size:19px}
.topbar .sub{color:var(--muted);font-size:13px}
.topbar .grow{flex:1}
.search{min-width:170px;width:300px;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 12px}
.content{padding:20px 22px;overflow:auto;flex:1}
.tabbar{display:none}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi small{color:var(--muted);font-weight:700;font-size:12px}
.kpi div{font-family:var(--f-d);font-size:32px;font-weight:800;line-height:1.1}
.kpi div span{font-size:15px;color:var(--muted);font-family:var(--f-b);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--bad-soft);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.panel>h3{margin:0;padding:12px 16px;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .who{flex:1;min-width:0}.lrow .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lrow .who span{color:var(--muted);font-size:12px}
.av{width:34px;height:34px;border-radius:50%;background:var(--sky-soft);color:var(--sky-d);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.empty{padding:22px 16px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sess-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.time{font-family:var(--f-d);font-weight:800;font-size:22px;color:var(--sky);line-height:1;min-width:84px}
.sess-h .who{flex:1;min-width:120px}.sess-h .who b{display:block}.sess-h .who span{color:var(--muted);font-size:12px}
.now{background:var(--sky);color:#fff}
.prog{font-size:12px;color:var(--muted);font-weight:700}
.plan{padding:8px 16px 14px}
.item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.item input{width:18px;height:18px;accent-color:var(--ok);flex:none}
.item span{flex:1;min-width:0}
.item.done span{text-decoration:line-through;color:var(--muted)}
.item .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px}
.add{display:flex;gap:8px;margin-top:8px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tools select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--sky-soft);color:var(--sky-d)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:10px 14px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--pale)}
tr:hover td{background:var(--pale)}
.acts{display:flex;gap:6px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--pale);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:320px}
.col-h{padding:12px 14px;border-bottom:1px solid var(--line)}
.col-h b{display:block;font-size:15px}.col-h span{color:var(--muted);font-size:12px}
.stripe{height:3px;border-radius:2px;margin-top:8px}
.col-b{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.col-b.over{background:var(--sky-soft)}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:grab}
.kc b{display:block}.kc .meta{display:flex;justify-content:space-between;gap:6px;margin-top:4px;color:var(--muted);font-size:12px}
.kc .acts{margin-top:8px;flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px;overflow-x:auto}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:200px;display:flex;flex-direction:column}
.day.today{border:2px solid var(--sky)}
.day-h{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:800;display:flex;justify-content:space-between}
.day-b{padding:8px;display:flex;flex-direction:column;gap:6px}
.slot{background:var(--sky-soft);border-radius:8px;padding:7px 9px;font-size:12px;cursor:pointer;border:0;text-align:start;color:var(--fg)}
.slot b{display:block;color:var(--sky-d)}
.coachs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.cc h3{margin:0;font-size:16px}.cc .sp{color:var(--muted);font-size:13px}
.cc .nums{display:flex;gap:18px;margin-top:12px}
.cc .nums div b{display:block;font-family:var(--f-d);font-size:26px;line-height:1}.cc .nums div small{color:var(--muted);font-size:12px}
/* auto messages */
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.rule-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rule-h b{font-size:15px}
.rule p{margin:0;color:var(--muted);font-size:13px}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.2s;pointer-events:none}
.sw span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--wa)}
.sw input:checked+span::after{inset-inline-start:21px}
.sw input:focus-visible+span{outline:2px solid var(--sky);outline-offset:2px}
.mrow{display:grid;grid-template-columns:92px 1fr auto;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:start}
.mrow:last-child{border-bottom:0}
.mdate{font-weight:800;font-size:13px}.mdate small{display:block;color:var(--muted);font-weight:600}
.mbody b{display:block}
.bub{background:var(--wa-bub);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:13px;max-width:60ch;white-space:pre-line;unicode-bidi:plaintext;text-align:start}
.mst{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ov{position:fixed;inset:0;background:#04324fa6;display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:580px;max-height:90vh;overflow:auto}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{margin:0}
.modal-b{padding:4px 20px 18px;display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.modal-b .full{grid-column:1/-1}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.xb{border:0;background:var(--sky-soft);color:var(--sky);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0c2a3e;color:#fff;padding:10px 16px;border-radius:9px;z-index:60;font-weight:700}
.set{max-width:680px;display:flex;flex-direction:column;gap:14px}
.set .panel{padding:16px}.set .panel h3{margin:0 0 4px;font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface);font-weight:700;font-size:13px}
.tag.on{background:var(--sky);color:#fff;border-color:var(--sky)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.rules{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{display:none}
  .tabbar{display:flex;overflow-x:auto;background:var(--side);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .tabbar .nav-i{flex:1 0 74px;flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;align-items:center;text-align:center}
  .tabbar .nav-i .cnt{display:none}
  .content{padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
  .topbar{padding:10px 16px}.topbar .grow{display:none}
  .search{width:100%;order:5}
  .modal-b{grid-template-columns:1fr}
  .kpi div{font-size:26px}
  .time{font-size:19px;min-width:70px}
  .mrow{grid-template-columns:1fr}.mst{flex-direction:row;align-items:center}
}

/* dashboard */
.dcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.dc{border:2px solid transparent;border-radius:14px;padding:16px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.dc small{font-weight:800;font-size:12px}
.dc b{font-family:var(--f-d);font-size:40px;line-height:1}
.dc span{font-weight:700;font-size:14px}
.dc em{font-style:normal;font-size:12px;color:var(--muted);margin-top:4px}
.dc.g{background:var(--ok-soft);color:var(--ok)}.dc.r{background:var(--bad-soft);color:var(--bad)}.dc.a{background:var(--warn-soft);color:var(--warn)}.dc.s{background:var(--sky-soft);color:var(--sky-d)}
.dc.on{border-color:currentColor;box-shadow:0 8px 24px #0b8fd622}
.total{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#0b8fd6;color:#fff;border-radius:14px;padding:16px 20px;margin-bottom:16px}
.total b{font-family:var(--f-d);font-size:40px;line-height:1}
.total .parts{display:flex;gap:18px;flex-wrap:wrap;font-weight:700;font-size:13px}
.total .parts i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px}
.chart{display:flex;align-items:flex-end;gap:14px;height:180px;padding:16px 16px 0}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .stk{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden}
.chart .stk i{display:block}
.chart .c small{color:var(--muted);font-size:11px;font-weight:700}
.chart .c em{font-style:normal;font-size:11px;font-weight:800}
.ccrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.ccrow:last-child{border-bottom:0}
.paygrid{display:flex;flex-direction:column;gap:10px;grid-column:1/-1;margin-top:12px}
.payopt{display:grid;grid-template-columns:auto 1fr 110px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.payopt input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok)}
.payopt input[type=number]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;width:100%}
.payopt small{display:block;color:var(--muted)}
@media (max-width:1000px){.dcards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.dc b{font-size:32px}.chart{gap:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.grid2.eq{grid-template-columns:1fr 1fr}
td .sm{display:none}
.more{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px}

/* ---------- dates & state ---------- */
const now=new Date();
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const TODAY=iso(now);
const pd=s=>new Date(s+"T12:00:00");
const plusDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const addDays=n=>plusDays(TODAY,n);
const plusMonth=s=>{const d=pd(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const diffDays=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const MONTH=TODAY.slice(0,7);
const fmt=s=>{const d=pd(s);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx".replace(/x/g,()=>(Math.random()*16|0).toString(16)));
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}};
let S0=load();(S0&&S0.setup&&S0.setup.sports||[]).forEach(k=>{if(String(k).startsWith('c:'))regCustom(k)});(S0&&S0.customs||[]).forEach(c=>{SP[c.k]={ic:"🏅",group:"custom",name:{fr:c.name,ar:c.name,en:c.name},kind:"level",cats:AGE,custom:true}});
let S=S0||{lang:"fr",theme:"auto",user:null,setup:null,data:null,tab:"today",ob:{step:1,role:"salle",sports:["tkd"]}};
let UNLOCK=false,PINBUF="";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};if(S.mode==="live")queueFlush()};
const t=()=>T[S.lang];
const lab=o=>o?(o[S.lang]||o.fr):"";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- sample data ---------- */
const FIRST=["Yassine","Salma","Ilyas","Nour","Hamza","Imane","Othmane","Rania","Mehdi","Aya","Anas","Hiba","Adam","Lina","Zakaria","Kenza","Omar","Sara","Ayoub","Malak"];
const LAST=["Benali","El Idrissi","Tahiri","Alaoui","Berrada","Chraibi","Kettani","Fassi","Lahlou","Bennani","Amrani","Saidi","Naji","Rami","Ouazzani","Tazi"];
const COACHN=["Karim","Nadia","Samir","Youssef","Hind","Rachid","Soukaina"];
function buildData(setup){
  const sports=setup.sports;
  const coachs=setup.role==="coach"?[{id:uid(),name:setup.you||"Coach",sport:sports[0]}]:sports.map((s,i)=>({id:uid(),name:"Coach "+COACHN[i%COACHN.length],sport:s}));
  const members=[],sessions=[],payments=[];let n=0;
  const pairs=setup.role==="coach"?sports.map(s=>[coachs[0],s]):coachs.map(c=>[c,c.sport]);
  const OFF=[2,31,8,34,15,29,40,5,22,30,12,37,19,27,1,33,10,24];
  pairs.forEach(([c,sid],ci)=>{const sp=SP[sid];
    sp.cats.slice(0,3).forEach((cat,k)=>{
      for(let j=0;j<3;j++){const i=n++;const id=uid();const off=OFF[i%OFF.length];
        members.push({id,name:FIRST[i%FIRST.length]+" "+LAST[(i*3)%LAST.length],phone:"066"+String(1000000+i*7919).slice(0,7),parent:"067"+String(2000000+i*6271).slice(0,7),coach:c.id,sport:sid,cat:k,belt:sp.kind==="belt"?Math.min(6,k*2+j%2):0,pos:j%((sp.pos||[1]).length),weight:k,formule:j%3,fee:Number(setup.fee)||150,ins:addDays([200,22,-4,90,140,12,300,60,170][i%9]),reg:addDays([120,9,200,60,14,300][i%6]),frozen:i%13===12,sample:true});
        payments.push({id:uid(),mid:id,type:"cot",date:addDays(-off),amount:Number(setup.fee)||150});
        if(off<20)payments.push({id:uid(),mid:id,type:"cot",date:plusDays(addDays(-off),-31),amount:Number(setup.fee)||150});
        for(let b=2;b<=5;b++)if((i+b)%3)payments.push({id:uid(),mid:id,type:"cot",date:plusDays(addDays(-off),-31*b),amount:Number(setup.fee)||150});
        if(i%4===0)payments.push({id:uid(),mid:id,type:"ins",date:addDays(-(i%5)),amount:100});
        if(i%7===0)payments.push({id:uid(),mid:id,type:"reg",date:addDays(-(i%6)),amount:200});
      }
      const days=ci%2?[2,4,6]:[1,3,5];if(ci===0&&!days.includes(now.getDay()))days.push(now.getDay());
      if(!sp.open)days.forEach(d=>sessions.push({id:uid(),day:d,start:String(17+k+ci%2).padStart(2,"0")+":00",end:String(18+k+ci%2).padStart(2,"0")+":00",coach:c.id,sport:sid,cat:k}));
    });
  });
  const plans={};const first=sessions.find(s=>s.day===now.getDay());
  if(first){plans[TODAY+"|"+first.id]=TPL[SP[first.sport].kind][S.lang].slice(0,4).map((x,i)=>({id:uid(),t:x,done:i<1}))}
  const leads=[["Karim Saidi","0671000001","trial"],["Lina Amrani","0671000002","trial"],["Adam Rami","0671000003","contact"],["Sara Naji","0671000004","won"]].map((a,i)=>({id:uid(),name:a[0],phone:a[1],sport:sports[i%sports.length],stage:a[2]}));
  return {coachs,members,payments,sessions,plans,leads};
}

/* ---------- payment logic: each student's own monthly due date ---------- */
const lastPay=id=>S.data.payments.filter(p=>p.mid===id&&(p.type||"cot")==="cot").sort((a,b)=>a.date.localeCompare(b.date)).pop();
const nMonths=m=>SP[m.sport]?.kind==="plan"?[1,3,12][m.formule||0]:1;
const dueOf=m=>{const lp=lastPay(m.id);if(!lp)return m.joined||TODAY;let d=lp.date;for(let i=0;i<nMonths(m);i++)d=plusMonth(d);return d};
const ADULT=["Seniors","Adultes","Juniors","Compétition","Hommes","Femmes"];
const ageOf=b=>{if(!b)return null;const d=new Date(b);if(isNaN(d))return null;const n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return a};
const yAge=b=>{if(!b)return null;const y=+String(b).slice(0,4);return y?new Date().getFullYear()-y:null};
function autoCat(sport,b){const c=SP[sport]?.cats,a=yAge(b);if(!c||a==null)return null;
 if(c===MART)return a<=7?0:a<=9?1:a<=11?2:a<=14?3:a<=17?4:5;
 if(c===COMBAT)return a<12?0:a<18?1:2;
 if(c===UFOOT||c===UTEAM){const i=c.findIndex(x=>/^U(\d+)$/.test(x.fr)&&a<+x.fr.slice(1));return i<0?c.length-1:i}
 return null}
const isSelf=m=>{const a=ageOf(m.birth);if(a!=null)return !!(SP[m.sport]?.open||a>=18);return !!(SP[m.sport]?.open||ADULT.includes((SP[m.sport]?.cats||[])[m.cat]?.fr))};
const recip=m=>isSelf(m)?(m.phone||m.parent):(m.parent||m.phone);
const isPaid=id=>{const m=S.data.members.find(x=>x.id===id);return m&&dueOf(m)>TODAY};
const stage=m=>{if(m.frozen)return"frozen";const d=dueOf(m);if(d>TODAY)return"paid";return diffDays(TODAY,d)>3?"late":"unpaid"};

const coachOf=id=>S.data.coachs.find(c=>c.id===id)||S.data.coachs[0];
const ini=n=>n.split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase();
const avH=(m,px)=>{const st=px?`width:${px}px;height:${px}px;font-size:${Math.round(px/3)}px`:"";return m.photo?`<div class="av" style="${st};padding:0;overflow:hidden"><img src="${m.photo}" alt="" style="width:100%;height:100%;object-fit:cover"></div>`:`<div class="av" style="${st}">${ini(m.name)}</div>`};
const memNo=m=>String(m.id||"").replace(/-/g,"").slice(0,6).toUpperCase();
const season=()=>{const d=new Date(),y=d.getFullYear();return d.getMonth()>=7?y+"/"+(y+1):(y-1)+"/"+y};
function shrinkPhoto(file){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),S2=360;c.width=S2;c.height=S2;const k=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,S2,S2);ok(c.toDataURL("image/jpeg",.78))};im.onerror=ko;im.src=r.result};r.onerror=ko;r.readAsDataURL(file)})}

function messages(){const A=S.setup.autoRules,out=[];
 S.data.members.filter(m=>!m.frozen).forEach(m=>{

    out.push({date:plusDays(d,-3),type:"cot",tpl:"pre",ref:d,m});out.push({date:d,type:"cot",tpl:"due",ref:d,m});
    if(!paid||plusDays(d,3)>TODAY)out.push({date:plusDays(d,3),type:"cot",tpl:"late",ref:d,m,cond:paid});}
  if(A.ins&&m.ins){out.push({date:plusDays(m.ins,-30),type:"ins",tpl:"ins",ref:m.ins,m});out.push({date:m.ins,type:"ins",tpl:"ins",ref:m.ins,m})}
  if(A.reg&&m.reg)out.push({date:plusDays(m.reg,-15),type:"reg",tpl:"reg",ref:m.reg,m});
 });
 const past=out.filter(x=>x.date<=TODAY&&x.date>=addDays(-7)&&!(x.tpl==="pre"&&false)).filter(x=>!(x.type==="cot"&&x.tpl!=="pre"&&x.ref>TODAY)).sort((a,b)=>b.date.localeCompare(a.date));

 document.querySelectorAll("[data-drop],[data-ldrop]").forEach(z=>{z.addEventListener("dragover",e=>{e.preventDefault();z.classList.add("over")});z.addEventListener("dragleave",()=>z.classList.remove("over"));
  z.addEventListener("drop",e=>{e.preventDefault();z.classList.remove("over");const [k,id]=e.dataTransfer.getData("text").split(":");
   if(k==="m"&&z.dataset.drop)setStage(id,z.dataset.drop==="late"?"unpaid":z.dataset.drop);
   if(k==="l"&&z.dataset.ldrop){const l=S.data.leads.find(x=>x.id===id);if(l){l.stage=z.dataset.ldrop;save();render()}}})});
}
function render(){applyPrefs();const r=document.getElementById("root");
  if(sb&&(!S.user||AUTHMODE==="reset")){r.innerHTML=vAuth();document.getElementById("authF").addEventListener("submit",e=>{e.preventDefault();authSubmit()});return}
 if(!S.user){r.innerHTML=vLogin();document.getElementById("loginF").addEventListener("submit",e=>{e.preventDefault();const em=document.getElementById("lg-e").value.trim(),pw=document.getElementById("lg-p").value;
  if(!/^\S+@\S+\.\S+$/.test(em)||pw.length<4){document.getElementById("lg-err").textContent=t().bad;return}S.user=em;save();render()});return}
 if(S.pin&&!UNLOCK){r.innerHTML=vLock();return}
 if(!S.setup||!S.data){r.innerHTML=vOnboard();return}
 if(!S.setup.autoRules)S.setup.autoRules={cot:true,ins:true,reg:true};
 if(!S.setup.trialEnds){S.setup.trialEnds=plusDays(TODAY,5);S.setup.plan="trial"}
 if(!tabs().includes(S.tab))S.tab=locked()?"billing":"dash";if(!S.setup.insFee){S.setup.insFee=100;S.setup.regFee=200}
 r.innerHTML=vApp();bindDnD();
 const q=document.getElementById("q");if(q&&Q.q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
if(sb){sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY"&&AUTHMODE!=="reset"){AUTHMODE="reset";render()}});
 sb.auth.getSession().then(({data})=>{const ses=data&&data.session;if(AUTHMODE==="reset"){render();return}
  if(ses&&ses.user){S.uid=ses.user.id;S.user=ses.user.email;S.mode="live";render();
   if(navigator.onLine)afterLogin(ses.user).catch(e=>{console.warn(e)});}
  else if(S.mode==="live"&&navigator.onLine){S.user=null;render()}
 }).catch(()=>render());}
render();
if(/demo/.test(location.search)&&!S.user){const b=document.querySelector('[data-act="demo"]');if(b)b.click()}
</script>

<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));</script>
