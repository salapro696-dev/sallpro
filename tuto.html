<style>

*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,#174a5c 0,transparent 60%),var(--dk);color:#fff;font:500 17px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif;padding:0 16px 40px}

<script>
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
