<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SallPro Admin</title><meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Barlow+Condensed:wght@700;800&family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout: platform owner console — KPI row, trial pipeline, sortable/filterable table of all gyms */
:root{--sky:#0b8fd6;--sky-d:#0873ad;--sky-soft:#e3f4fd;--pale:#f4faff;--bg:#f4faff;--surface:#fff;--line:#d7e9f5;--fg:#0c2a3e;--muted:#587389;
 --ok:#14915a;--ok-soft:#e3f6ec;--bad:#d23b3b;--bad-soft:#fde8e8;--warn:#b7790a;--warn-soft:#fff3dc;--wa:#1fa855;
 --f-d:"Barlow Condensed","Arial Narrow",sans-serif;--f-b:"Manrope","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#38bdf8;--sky-d:#7dd3fc;--sky-soft:#0d2e44;--pale:#0b1f2e;--bg:#06141f;--surface:#0b1f2e;--line:#173449;--fg:#e6f4fc;--muted:#8fb0c6;--ok:#3ccf8a;--ok-soft:#0f2e22;--bad:#ff6b6b;--bad-soft:#3a1618;--warn:#f2b441;--warn-soft:#33270b;color-scheme:dark}}
:root[data-theme="dark"]{--sky:#38bdf8;--sky-d:#7dd3fc;--sky-soft:#0d2e44;--pale:#0b1f2e;--bg:#06141f;--surface:#0b1f2e;--line:#173449;--fg:#e6f4fc;--muted:#8fb0c6;--ok:#3ccf8a;--ok-soft:#0f2e22;--bad:#ff6b6b;--bad-soft:#3a1618;--warn:#f2b441;--warn-soft:#33270b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header{background:#0b8fd6;color:#fff;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w{max-width:1200px;margin:0 auto}
header .w{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-weight:800;font-size:26px}
.mark{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center}.mark i{display:block;width:19px;height:5px;border-radius:2px;background:#0c2a3e;box-shadow:0 -6px 0 #0b8fd6,0 6px 0 #0b8fd6}
.badge{background:#fff;color:#0873ad;font-weight:800;font-size:12px;border-radius:999px;padding:3px 10px}
header .sp{margin-inline-start:auto;font-size:13px;color:#e3f4fd}
main{padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:start;cursor:pointer}
.kpi.on{border:2px solid var(--sky)}
.kpi small{color:var(--muted);font-weight:700;font-size:12px;display:block}
.kpi b{font-family:var(--f-d);font-size:34px;line-height:1.1;display:block}
.kpi span{font-size:12px;color:var(--muted)}
.k-ok b{color:var(--ok)}.k-warn b{color:var(--warn)}.k-bad b{color:var(--bad)}.k-sky b{color:var(--sky)}
.row{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.panel h3{margin:0;padding:12px 16px;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding:16px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.chart i{display:block;width:100%;max-width:38px;border-radius:6px 6px 0 0;background:var(--sky)}
.chart div:last-child i{background:var(--ok)}
.chart small{font-size:11px;color:var(--muted);font-weight:700}.chart em{font-style:normal;font-size:11px;font-weight:800}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}.lrow:last-child{border-bottom:0}
.lrow .who{flex:1;min-width:0}.lrow .who b{display:block}.lrow .who span{color:var(--muted);font-size:12px}
.pill{display:inline-flex;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-sky{background:var(--sky-soft);color:var(--sky-d)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:700;font-size:12px;background:var(--surface);cursor:pointer;text-decoration:none;color:var(--fg)}
.btn-g{background:var(--wa);border-color:var(--wa);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.tools input,.tools select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px}
.tools input{flex:1;min-width:160px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{font-size:12px;color:var(--muted);background:var(--pale);cursor:pointer;user-select:none}
tr:last-child td{border-bottom:0}
.note{color:var(--muted);font-size:12px;margin-top:12px}

.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:14px 16px}
.req{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.req.done{opacity:.6}
.req-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.req-h b{display:block}.req-h span{color:var(--muted);font-size:12px}
.rcpt{display:flex;gap:12px;align-items:center}
.rcpt svg{flex:none;border-radius:8px;border:1px solid var(--line);background:#fff}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px}.kv span{color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn-p{background:var(--sky);border-color:var(--sky);color:#fff}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.row{grid-template-columns:1fr}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi b{font-size:28px}}
.mark{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23ffffff%22/%3E%3Ccircle%20cx%3D%2217%22%20cy%3D%2217%22%20r%3D%224.5%22%20fill%3D%22none%22%20stroke%3D%22%230b8fd6%22%20stroke-width%3D%223%22/%3E%3Cpath%20d%3D%22M20%2020.5%20L24%2024.5%22%20stroke%3D%22%230b8fd6%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M30%2019%20H52%20a3%203%200%200%201%203%203%20v7%20a3%203%200%200%201%20-3%203%20H44%20A15%2015%200%201%201%2030%2019%20Z%22%20fill%3D%22%230b8fd6%22/%3E%3Crect%20x%3D%2234%22%20y%3D%2222.5%22%20width%3D%226%22%20height%3D%224%22%20rx%3D%221.5%22%20fill%3D%22%23ffffff%22/%3E%3Ccircle%20cx%3D%2230%22%20cy%3D%2235%22%20r%3D%225.5%22%20fill%3D%22%230c2a3e%22/%3E%3C/svg%3E") center/100% no-repeat!important;box-shadow:none!important;border-radius:9px}
.mark i{display:none!important}
.card .mark{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%230b8fd6%22/%3E%3Ccircle%20cx%3D%2217%22%20cy%3D%2217%22%20r%3D%224.5%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%223%22/%3E%3Cpath%20d%3D%22M20%2020.5%20L24%2024.5%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M30%2019%20H52%20a3%203%200%200%201%203%203%20v7%20a3%203%200%200%201%20-3%203%20H44%20A15%2015%200%201%201%2030%2019%20Z%22%20fill%3D%22%23ffffff%22/%3E%3Crect%20x%3D%2234%22%20y%3D%2222.5%22%20width%3D%226%22%20height%3D%224%22%20rx%3D%221.5%22%20fill%3D%22%230b8fd6%22/%3E%3Ccircle%20cx%3D%2230%22%20cy%3D%2235%22%20r%3D%225.5%22%20fill%3D%22%230c2a3e%22/%3E%3C/svg%3E")!important}
.logo{font-family:"Poppins","Manrope",system-ui,sans-serif!important;font-weight:700!important;letter-spacing:-.5px;font-size:24px!important}
.logo b.pro{color:#bfe6fb;font-weight:800}
.card .logo b.pro{color:var(--sky)}


.center{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:wait}
.empty{padding:20px 16px;color:var(--muted)}
.ref{font-size:12px;color:var(--muted)}
</style></head><body>
<header><div class="w"><div class="logo"><span class="mark"><i></i></span><span>Sall<b class="pro">Pro</b></span></div><span class="badge">Admin</span><span class="sp num" id="today"></span>
<a class="btn" style="background:#fff;margin-inline-start:10px" href="/app">Application</a><button class="btn" style="background:#fff" id="refresh">Actualiser</button></div></header>
<main><div class="w" id="main"><div class="center">Chargement…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=window.supabase.createClient("https://bqaabislojlebfpuvtxq.supabase.co","sb_publishable_e-ibQ_7thrb3sRV2EmqPsw_oXbOy2XI");
const PRICE={coach:25,salle:25};const M=document.getElementById("main");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>{if(!s)return"—";const d=new Date(s);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()};
const wa=p=>{let d=String(p||"").replace(/\D/g,"");if(d.startsWith("0"))d="212"+d.slice(1);return d};
const meth={virement:"Virement",cashplus:"CashPlus / Wafacash",wafacash:"Wafacash",card:"Carte"};
document.getElementById("today").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});
let C=[],REQ=[],F={q:"",s:""};
async function load(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){M.innerHTML='<div class="center"><div><p>Connectez-vous d\'abord dans l\'application avec votre compte admin.</p><a class="btn btn-p" href="/app">Ouvrir l\'application</a></div></div>';return}
 const a=await sb.rpc("is_platform_admin");
 if(a.error||!a.data){M.innerHTML='<div class="center"><p>Ce compte ('+esc(session.user.email)+') n\'a pas accès à l\'espace admin.</p></div>';return}
 const [c,r]=await Promise.all([sb.rpc("admin_clubs"),sb.rpc("admin_requests")]);
 if(c.error||r.error){M.innerHTML='<div class="center"><p>Erreur : '+esc((c.error||r.error).message)+'</p></div>';return}
 C=(c.data||[]).map(x=>x.status==="expired"&&!x.paid_until?{...x,status:"trial"}:x);REQ=r.data||[];
 const lg=await sb.from("platform_ledger").select("*").order("day",{ascending:false}).order("created_at",{ascending:false});LG=lg.error?null:(lg.data||[]);draw()}
let LG=null;const CATS=[["abonnement","Abonnement"],["pub","Publicité"],["domaine","Domaine / site"],["tel","Téléphone / internet"],["transport","Transport"],["materiel","Matériel / impression"],["autre","Autre"]];
const dh=n=>Number(n||0).toLocaleString("fr-FR",{maximumFractionDigits:2})+" DH";
function finPanel(){if(LG===null)return `<div class="panel" style="margin-bottom:16px"><h3>Finances</h3><div class="empty">Exécutez le SQL « platform_ledger » dans Supabase pour activer le suivi des entrées et dépenses.</div></div>`;
 const m=new Date().toISOString().slice(0,7),sum=(k,f)=>LG.filter(x=>x.kind===k&&(!f||String(x.day).startsWith(f))).reduce((a,x)=>a+Number(x.amount),0);
 const inM=sum("in",m),outM=sum("out",m),inT=sum("in"),outT=sum("out"),cat=Object.fromEntries(CATS);
 const box=(t,a,b,col)=>`<div style="flex:1;min-width:150px;border:1px solid var(--line);border-radius:12px;padding:12px 14px"><small style="color:var(--muted)">${t}</small><b class="num" style="display:block;font-size:24px;color:${col}">${a}</b><span style="color:var(--muted);font-size:13px">Total : ${b}</span></div>`;
 return `<div class="panel" style="margin-bottom:16px"><h3>Finances <span class="ref">ce mois · total</span></h3>
 <div style="display:flex;gap:12px;flex-wrap:wrap;padding:14px 16px">${box("Entrées ce mois",dh(inM),dh(inT),"var(--ok)")}${box("Dépenses ce mois",dh(outM),dh(outT),"var(--bad)")}${box("Bénéfice ce mois",dh(inM-outM),dh(inT-outT),inM-outM>=0?"var(--ok)":"var(--bad)")}</div>
 <form id="lgF" class="tools" style="flex-wrap:wrap">
  <select id="lg-k" onchange="document.getElementById('lg-c').value=this.value==='in'?'abonnement':'pub'"><option value="out">Dépense</option><option value="in">Entrée</option></select>
  <input id="lg-a" type="number" min="0" step="1" placeholder="Montant (DH)" style="max-width:140px;flex:0">
  <input id="lg-l" placeholder="Libellé (ex. pub Instagram, domaine, puce…)">
  <select id="lg-c">${CATS.map(c=>`<option value="${c[0]}" ${c[0]==="pub"?"selected":""}>${c[1]}</option>`).join("")}</select>
  <select id="lg-s"><option value="">Salle (facultatif)</option>${C.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
  <input id="lg-d" type="date" value="${new Date().toISOString().slice(0,10)}" style="max-width:160px;flex:0">
  <button class="btn btn-p" type="submit">Ajouter</button></form>
 ${LG.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Type</th><th>Libellé</th><th>Catégorie</th><th style="text-align:end">Montant</th><th></th></tr></thead><tbody>${LG.slice(0,40).map(x=>`<tr><td class="num">${fmt(x.day)}</td><td><span class="pill ${x.kind==="in"?"p-ok":"p-bad"}">${x.kind==="in"?"Entrée":"Dépense"}</span></td><td>${esc(x.label||"")}${x.club_id?` <small style="color:var(--muted)">· ${esc((C.find(c=>c.id===x.club_id)||{}).name||"")}</small>`:""}</td><td>${cat[x.category]||esc(x.category)}</td><td class="num" style="text-align:end;font-weight:700;color:${x.kind==="in"?"var(--ok)":"var(--bad)"}">${x.kind==="in"?"+":"−"} ${dh(x.amount)}</td><td><button class="btn" data-lgdel="${x.id}">×</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Aucune opération. Ajoutez vos entrées (abonnements reçus) et vos dépenses (pub, domaine…).</div>`}</div>`}
function draw(){
 const paid=C.filter(c=>c.status==="paid"),trial=C.filter(c=>c.status==="trial"),exp=C.filter(c=>c.status==="expired");
 const mrr=paid.reduce((a,c)=>a+(PRICE[c.plan]||0),0),stu=C.reduce((a,c)=>a+Number(c.students||0),0);
 const pend=REQ.filter(r=>r.status==="pending");
 const k=[["","k-sky","Salles inscrites",C.length,"au total"],["paid","k-ok","Payantes",paid.length,"actives"],["trial","k-warn","Non activées",trial.length,"pas encore payé"],["expired","k-bad","Expirées",exp.length,"à relancer"],["","","Revenu mensuel",mrr.toLocaleString("fr-FR")+" DH","abonnements actifs"],["","","Élèves gérés",stu.toLocaleString("fr-FR"),"dans toutes les salles"]];
 const today=new Date();today.setHours(0,0,0,0);
 const trials=trial.slice().sort((a,b)=>String(a.trial_ends_at).localeCompare(String(b.trial_ends_at)));
 let rows=C.filter(c=>(!F.q||(c.name+" "+(c.city||"")).toLowerCase().includes(F.q))&&(!F.s||c.status===F.s));
 const st={paid:["p-ok","Payante"],trial:["p-warn","Non activée"],expired:["p-bad","Expirée"]};
 M.innerHTML=`<div class="kpis">${k.map(x=>`<button class="kpi ${x[1]} ${F.s&&F.s===x[0]?"on":""}" data-s="${x[0]}"><small>${x[2]}</small><b class="num">${x[3]}</b><span>${x[4]}</span></button>`).join("")}</div>${finPanel()}
 <div class="panel" style="margin-bottom:16px"><h3>Demandes d'activation <span class="pill ${pend.length?"p-warn":"p-ok"} num">${pend.length} en attente</span></h3>
  ${REQ.length?`${pend.length?"":`<div class="empty" style="margin-bottom:10px">Aucune demande en attente.</div>`}<div class="reqs">${REQ.filter(r=>r.status==="pending"||F.hist).map(r=>`<div class="req ${r.status!=="pending"?"done":""}"><div class="req-h"><div><b>${esc(r.club_name)}</b><span>${esc(r.city||"")} · ${fmt(r.created_at)}</span></div>${r.status==="pending"?'<span class="pill p-warn">À vérifier</span>':r.status==="approved"?'<span class="pill p-ok">Activée</span>':'<span class="pill p-bad">Refusée</span>'}</div>
   <div class="kv"><span>Formule</span><b>${r.plan==="coach"?"Coach":"Salle"} · ${r.period==="year"?"annuel":"mensuel"}</b></div><div class="kv"><span>Montant</span><b class="num">${Number(r.amount).toLocaleString("fr-FR")} DH</b></div><div class="kv"><span>Paiement</span><b>${meth[r.method]||r.method}</b></div>
   <p class="ref">Vérifiez le reçu reçu sur WhatsApp avant d'activer.</p>
   ${r.status==="pending"?`<div class="acts"><button class="btn btn-p" data-ok="${r.id}">Activer</button><button class="btn" data-no="${r.id}">Refuser</button>${r.whatsapp?`<a class="btn btn-g" target="_blank" rel="noopener" href="https://wa.me/${wa(r.whatsapp)}">WhatsApp</a>`:""}</div>`:""}</div>`).join("")}</div>${REQ.length>pend.length?`<button class="btn" style="margin-top:12px" data-hist="1">${F.hist?"Masquer l'historique":"Voir l'historique ("+(REQ.length-pend.length)+")"}</button>`:""}`:'<div class="empty">Aucune demande pour le moment. Elles apparaîtront ici dès qu\'une salle enverra son reçu.</div>'}</div>
 <div class="row"><div class="panel"><h3>Salles non activées <span class="pill p-warn num">${trials.length}</span></h3>${trials.length?trials.map(c=>{const d=Math.round((new Date(c.trial_ends_at)-today)/864e5);return `<div class="lrow"><div class="who"><b>${esc(c.name)}</b><span>${esc(c.city||"")} · ${c.students} élèves</span></div>${c.whatsapp?`<a class="btn btn-g" target="_blank" rel="noopener" href="https://wa.me/${wa(c.whatsapp)}?text=${encodeURIComponent("Bonjour, votre compte SallPro n'est pas encore activé. On l'active ensemble ?")}">WhatsApp</a>`:""}<button class="btn btn-p" data-act1="${c.id}" data-name="${esc(c.name)}">Activer 1 an</button><button class="btn" data-del="${c.id}" data-name="${esc(c.name)}">Supprimer</button></div>`}).join(""):'<div class="empty">Toutes les salles sont activées.</div>'}</div>
  <div class="panel"><h3>Activité</h3><div class="lrow"><div class="who"><b>Vos revenus SallPro</b><span>abonnements encaissés (total)</span></div><b class="num">${LG?dh(LG.filter(x=>x.kind==="in"&&x.category==="abonnement").reduce((a,x)=>a+Number(x.amount),0)):REQ.filter(r=>r.status==="approved").reduce((x,r)=>x+Number(r.amount||0),0).toLocaleString("fr-FR")+" DH"}</b></div><div class="lrow"><div class="who"><b>Cotisations encaissées par vos clients</b><span>argent des élèves, saisi dans les salles ce mois</span></div><b class="num">${C.reduce((a,c)=>a+Number(c.collected_month||0),0).toLocaleString("fr-FR")} DH</b></div><div class="lrow"><div class="who"><b>Nouvelles salles inscrites (7 derniers jours)</b></div><b class="num">${C.filter(c=>Date.now()-new Date(c.created_at)<7*864e5).length}</b></div><div class="lrow"><div class="who"><b>Salles qui ont utilisé l'app aujourd'hui</b></div><b class="num">${C.filter(c=>c.last_active_at&&Date.now()-new Date(c.last_active_at)<864e5).length}</b></div></div></div>
 <div class="panel"><h3>Toutes les salles <span class="ref num">${rows.length} salles</span></h3>
  <div class="tools"><input id="q" placeholder="Rechercher une salle ou une ville…" value="${esc(F.q)}" aria-label="Rechercher"><select id="fs" aria-label="Statut"><option value="">Tous les statuts</option><option value="paid" ${F.s==="paid"?"selected":""}>Payante</option><option value="trial" ${F.s==="trial"?"selected":""}>Non activée</option><option value="expired" ${F.s==="expired"?"selected":""}>Expirée</option></select></div>
  ${rows.length?`<div class="tw"><table><thead><tr><th>Salle</th><th>Ville</th><th>Sports</th><th>Formule</th><th>Statut</th><th>Élèves</th><th>Encaissé ce mois</th><th>Compte créé le</th><th>Abonnement jusqu'au</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.city||"—")}</td><td>${esc((c.sports||[]).map(s=>String(s).replace(/^c:/,"")).join(", "))}</td><td>${c.status==="paid"?"299 DH / an":"—"}</td><td><span class="pill ${st[c.status][0]}">${st[c.status][1]}</span></td><td class="num">${c.students}</td><td class="num">${Number(c.collected_month||0).toLocaleString("fr-FR")} DH</td><td class="num">${fmt(c.created_at)}</td><td class="num">${fmt(c.paid_until)}</td><td>${c.whatsapp?`<a class="btn btn-g" target="_blank" rel="noopener" href="https://wa.me/${wa(c.whatsapp)}">WhatsApp</a>`:""} <button class="btn btn-p" data-act1="${c.id}" data-name="${esc(c.name)}">${c.status==="paid"?"+1 an":"Activer 1 an"}</button> <button class="btn" data-del="${c.id}" data-name="${esc(c.name)}">Supprimer</button></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">Aucune salle ne correspond.</div>'}</div>`;
 const q=document.getElementById("q");if(q&&F.q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
document.addEventListener("input",e=>{if(e.target.id==="q"){F.q=e.target.value.toLowerCase();draw()}if(e.target.id==="fs"){F.s=e.target.value;draw()}});
document.addEventListener("click",async e=>{const k=e.target.closest(".kpi");if(k){F.s=F.s===k.dataset.s?"":k.dataset.s;draw();return}
 if(e.target.closest("[data-hist]")){F.hist=!F.hist;draw();return}
 const lgd=e.target.closest("[data-lgdel]");if(lgd){if(!confirm("Supprimer cette opération ?"))return;await sb.from("platform_ledger").delete().eq("id",lgd.dataset.lgdel);await load();return}
 const act=e.target.closest("[data-act1]");if(act){if(!confirm("Activer « "+act.dataset.name+" » pour 1 an (299 DH) ?\nVérifiez d'abord que le virement est bien reçu."))return;
  const amt=prompt("Montant reçu (DH) ? Mettez 0 si c'est gratuit.","299");if(amt===null)return;
  act.disabled=true;act.textContent="Activation…";const r=await sb.rpc("admin_activate_club",{p_club:act.dataset.act1});
  if(r.error){act.disabled=false;act.textContent=/function|schema cache/i.test(r.error.message)?"SQL manquant (voir Claude)":"Erreur";alert(r.error.message);return}
  const n=Number(String(amt).replace(",","."))||0;if(n>0&&LG!==null)await sb.from("platform_ledger").insert({kind:"in",amount:n,label:"Abonnement 1 an · "+act.dataset.name,category:"abonnement",club_id:act.dataset.act1});
  await load();return}
 const del=e.target.closest("[data-del]");if(del){if(!confirm("Supprimer définitivement « "+del.dataset.name+" » avec ses élèves, paiements et séances ? Cette action est irréversible."))return;
  del.disabled=true;del.textContent="Suppression…";const r=await sb.rpc("admin_delete_club",{p_club:del.dataset.del});
  if(r.error){del.disabled=false;del.textContent=/function|schema cache/i.test(r.error.message)?"SQL manquant (voir Claude)":"Erreur";alert(r.error.message);return}await load();return}
 const ok=e.target.closest("[data-ok]"),no=e.target.closest("[data-no]");const b=ok||no;if(!b)return;
 b.disabled=true;b.textContent=ok?"Activation…":"…";
 const r=await sb.rpc(ok?"approve_request":"reject_request",{p_id:b.dataset.ok||b.dataset.no});
 if(r.error){b.disabled=false;b.textContent="Erreur : "+r.error.message;return}await load()});
document.getElementById("refresh").addEventListener("click",load);
load();

document.addEventListener("submit",async e=>{if(e.target.id!=="lgF")return;e.preventDefault();const g=id=>document.getElementById(id).value;
 const a=Number(String(g("lg-a")).replace(",","."));if(!(a>0)){alert("Indiquez un montant.");return}
 const r=await sb.from("platform_ledger").insert({kind:g("lg-k"),amount:a,label:g("lg-l").trim(),category:g("lg-c"),club_id:g("lg-s")||null,day:g("lg-d")||undefined});
 if(r.error){alert(r.error.message);return}await load()});
</script></body></html>
