<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b8fd6">
<meta name="description" content="SallPro : le logiciel marocain de gestion de salles de sport. Cotisations, rappels WhatsApp automatiques, ceintures, séances. Français, arabe, anglais.">
<link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon-512.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>SallPro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: sky-blue hero with zellige texture + phone mockup, then alternating white / pale-sky bands: numbers, problem→solution, automation timeline, salle→coachs→élèves, pricing, FAQ */
:root{
  --sky:#0b8fd6; --sky-d:#0873ad; --sky-soft:#e3f4fd; --sky-pale:#f4faff;
  --ink:#0c2a3e; --muted:#587389; --bg:#ffffff; --line:#d7e9f5;
  --ok:#14915a; --ok-soft:#e3f6ec; --bad:#d23b3b; --bad-soft:#fde8e8; --warn:#b7790a; --warn-soft:#fff3dc; --wa:#1fa855;
  --f-d:"Barlow Condensed","Arial Narrow",sans-serif; --f-b:"Manrope","Segoe UI",system-ui,sans-serif; --f-a:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#38bdf8;--sky-d:#7dd3fc;--sky-soft:#0d2e44;--sky-pale:#0b1f2e;--ink:#e6f4fc;--muted:#8fb0c6;--bg:#06141f;--line:#173449;--ok:#3ccf8a;--ok-soft:#0f2e22;--bad:#ff6b6b;--bad-soft:#3a1618;--warn:#f2b441;--warn-soft:#33270b;color-scheme:dark}}
:root[data-theme="dark"]{--sky:#38bdf8;--sky-d:#7dd3fc;--sky-soft:#0d2e44;--sky-pale:#0b1f2e;--ink:#e6f4fc;--muted:#8fb0c6;--bg:#06141f;--line:#173449;--ok:#3ccf8a;--ok-soft:#0f2e22;--bad:#ff6b6b;--bad-soft:#3a1618;--warn:#f2b441;--warn-soft:#33270b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.6}
[dir="rtl"] body,[dir="rtl"] button{font-family:var(--f-a)}
button{font:inherit;color:inherit}
a{color:var(--sky)}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.w{max-width:1140px;margin:0 auto}
.band{padding-block:72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pale{background:var(--sky-pale)}
.eyebrow{font-family:var(--f-d);font-weight:700;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--sky)}
[dir="rtl"] .eyebrow{font-family:var(--f-a);letter-spacing:0;font-size:14px}
h2{font-family:var(--f-d);font-size:clamp(34px,5vw,52px);line-height:1;margin:8px 0 14px;text-transform:uppercase;text-wrap:balance}
[dir="rtl"] h2{font-family:var(--f-a);text-transform:none;line-height:1.3;font-size:clamp(28px,4vw,40px)}
.lead{color:var(--muted);max-width:62ch;margin:0 0 32px;font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:13px 20px;font-weight:800;cursor:pointer;text-decoration:none;border:2px solid transparent;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn-w{background:#fff;color:#0873ad}
.btn-o{background:transparent;color:#fff;border-color:#ffffff80}
.btn-s{background:var(--sky);color:#fff}
.btn-wa{background:var(--wa);color:#fff}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0b8fd6;color:#fff;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:box-shadow .2s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0b8fd6}
.top.sh{box-shadow:0 6px 24px #0b4a7040}
.top .w{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-weight:800;font-size:28px;color:#fff;text-decoration:none;letter-spacing:.5px}
.logo small{font-family:var(--f-b);font-size:13px;font-weight:700;opacity:.75}
.mark{width:36px;height:36px;border-radius:9px;background:#fff;display:grid;place-items:center}
.mark i{display:block;width:20px;height:5px;border-radius:2px;background:#0c2a3e;box-shadow:0 -6px 0 #0b8fd6,0 6px 0 #0b8fd6}
.links{display:flex;gap:18px;margin-inline-start:auto;font-weight:700}
.links a{color:#fff;text-decoration:none;opacity:.9}
.langs{display:flex;background:#ffffff26;border-radius:8px;padding:3px}
.langs button{border:0;background:transparent;color:#fff;padding:4px 10px;border-radius:6px;cursor:pointer;font-weight:800;font-size:13px}
.langs button.on{background:#fff;color:#0873ad}

/* hero */
.hero{background-color:#0b8fd6;background-image:var(--zel);color:#fff;padding-block:48px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.hero-g{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.hero-g>*{min-width:0}
.sports{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.sports span{background:#ffffff26;border:1px solid #ffffff40;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:8px;background:#ffffff26;border:1px solid #ffffff40;padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px}
.chip b{background:#fff;color:#0873ad;border-radius:999px;padding:0 8px;font-size:12px}
.hero h1{font-family:var(--f-d);font-weight:800;font-size:clamp(38px,4.6vw,62px);line-height:1;margin:18px 0;text-transform:uppercase;text-wrap:balance}
[dir="rtl"] .hero h1{font-family:var(--f-a);text-transform:none;line-height:1.35;font-size:clamp(28px,3.6vw,44px)}
.hero h1 span{display:inline;background:#fff;color:#0c2a3e;padding:0 8px;border-radius:6px;font-size:.86em;line-height:1.25;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero p{font-size:19px;max-width:50ch;color:#eef8ff;margin:0 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;font-size:14px;color:#e3f4fd;font-weight:600}
.trust span::before{content:"✓ ";font-weight:800}
.belts{display:flex;gap:5px;margin-top:30px;max-width:340px}.belts span{flex:1;height:7px;border-radius:2px}

/* phone */
.stage{position:relative;display:flex;justify-content:center;min-height:540px}
.phone{width:290px;max-width:100%;background:#0c2a3e;border-radius:38px;padding:12px;box-shadow:0 40px 80px #04324f66;position:relative;z-index:2;animation:float 6s ease-in-out infinite}
.screen{background:#fff;border-radius:28px;overflow:hidden;color:#0c2a3e;min-height:500px}
.s-top{background:#0b8fd6;color:#fff;padding:16px 16px 14px}
.s-top b{display:block;font-size:15px}.s-top small{opacity:.85;font-size:12px}
.s-kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.s-kpi div{background:#f4faff;border:1px solid #d7e9f5;border-radius:10px;padding:8px 10px;font-size:11px;color:#587389;font-weight:700}
.s-kpi div strong{display:block;font-family:var(--f-d);font-size:24px;color:#0c2a3e;line-height:1.1}
.s-row{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid #e8f2f9;font-size:13px}
.s-row .av{width:28px;height:28px;border-radius:50%;background:#e3f4fd;color:#0873ad;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.s-row .nm{flex:1;min-width:0;font-weight:700}
.s-row .nm small{display:block;color:#587389;font-weight:500;font-size:11px}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.p-ok{background:#e3f6ec;color:#14915a}.p-bad{background:#fde8e8;color:#d23b3b}.p-warn{background:#fff3dc;color:#b7790a}
.bubble{position:absolute;z-index:3;background:#fff;color:#0c2a3e;border-radius:16px;padding:12px 14px;width:250px;max-width:70%;box-shadow:0 20px 40px #04324f55;font-size:13px}
.bubble .h{display:flex;align-items:center;gap:6px;font-weight:800;font-size:12px;color:#1fa855;margin-bottom:4px}
.b1{inset-inline-end:-6px;top:40px;animation:pop 6s ease-in-out infinite}
.b2{inset-inline-start:-10px;bottom:46px;animation:pop 6s ease-in-out 3s infinite}
.bubble .t{color:#587389;font-size:11px;text-align:end;margin-top:4px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pop{0%,100%{transform:scale(1)}10%{transform:scale(1.04)}20%{transform:scale(1)}}


.team{background-color:#0b8fd6;background-image:var(--zel);padding-block:28px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:2}
.team figure{margin:0 auto;max-width:1140px;border-radius:22px;overflow:hidden;box-shadow:0 30px 70px #04324f33;position:relative;background:var(--sky-soft)}
.team img{display:block;width:100%;height:auto;max-width:100%}
.team figcaption{position:absolute;inset-inline-start:20px;bottom:20px;background:#ffffffeb;color:#0c2a3e;border-radius:12px;padding:10px 16px;font-weight:800;font-size:15px;max-width:calc(100% - 40px);box-shadow:0 10px 30px #04324f33}
.team figcaption span{display:block;font-weight:600;font-size:13px;color:#587389}
@media (max-width:640px){.team{padding-top:16px}.team figure{border-radius:16px}.team figcaption{position:static;max-width:none;border-radius:0;box-shadow:none;background:#fff;font-size:14px;padding:10px 14px}}


.ph{position:relative;background:#04324f;color:#fff;overflow:hidden;min-height:clamp(620px,66vw,900px);display:flex;align-items:flex-end}
.ph-img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:center 0%}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#04324ffa 0%,#04324fe6 30%,#04324f99 44%,#04324f00 60%);pointer-events:none}
.ph-in{position:relative;z-index:1;width:100%;padding-block:40px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ph h1{font-family:var(--f-d);font-weight:800;font-size:clamp(34px,4vw,56px);line-height:1.02;margin:12px 0 10px;text-transform:uppercase;text-wrap:balance;max-width:22ch}
[dir="rtl"] .ph h1{font-family:var(--f-a);text-transform:none;line-height:1.35;font-size:clamp(28px,3.8vw,48px)}
.ph h1 span{color:#7dd3fc}
.ph p{font-size:17px;max-width:60ch;color:#e3f4fd;margin:0 0 22px}
.hero h2{margin-top:6px}
@media (max-width:640px){
 .ph{display:block;min-height:0;background:#0b8fd6}
 .ph-img{position:static;height:auto;aspect-ratio:4/3;width:100%}
 .ph::after{display:none}
 .ph-in{padding-block:24px 36px;background:#0b8fd6}
 .ph h1 span{color:#0c2a3e;background:#fff;padding:0 6px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
}


.vtabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.vtab{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:800;color:var(--ink)}
.vtab b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sky-soft);color:var(--sky-d);font-size:13px}
.vtab.on{border-color:var(--sky);background:var(--sky-soft)}.vtab.on b{background:var(--sky);color:#fff}
.vstage{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:center}
.vdev video{display:block;width:100%;height:auto;background:#0c2a3e}
.vdev.pc{border:10px solid #0c2a3e;border-bottom-width:22px;border-radius:16px;box-shadow:0 30px 60px #04324f33;overflow:hidden;background:#0c2a3e}
.vdev.ph{width:min(330px,100%);margin:0 auto;border:10px solid #0c2a3e;border-radius:36px;overflow:hidden;box-shadow:0 30px 60px #04324f33;background:#0c2a3e}
.vside h3{margin:0 0 8px;font-size:22px}.vside p{color:var(--muted);margin:0 0 14px}
.vside .note{font-size:13px}
@media (max-width:900px){.vstage{grid-template-columns:1fr}.vside{text-align:center}}
@media (max-width:640px){.vtabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.vtab{flex:none}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--bg)}
.stat b{display:block;font-family:var(--f-d);font-size:58px;line-height:1;color:var(--sky);font-weight:800}
.stat p{margin:8px 0 10px;font-weight:600}
.stat small{color:var(--muted);font-size:12px}
.srcs{margin-top:18px;font-size:13px;color:var(--muted)}

/* problem → solution */
.ps{display:flex;flex-direction:column;gap:14px}
.ps-row{display:grid;grid-template-columns:1fr 54px 1fr;align-items:stretch}
.ps-c{border-radius:14px;padding:18px 20px;min-width:0}
.ps-p{background:var(--bad-soft);border:1px solid transparent}
.ps-s{background:var(--bg);border:2px solid var(--sky)}
.ps-c small{display:block;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
[dir="rtl"] .ps-c small{letter-spacing:0}
.ps-p small{color:var(--bad)}.ps-s small{color:var(--sky)}
.ps-c h3{margin:0 0 4px;font-size:18px}
.ps-c p{margin:0;color:var(--muted);font-size:15px}
.arrow{display:grid;place-items:center;color:var(--sky);font-size:26px;font-weight:800}
[dir="rtl"] .arrow{transform:scaleX(-1)}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(6,1fr);gap:0;position:relative}
.tl::before{content:"";position:absolute;top:27px;inset-inline:8%;height:3px;background:linear-gradient(90deg,var(--sky),var(--wa))}
.tl-i{text-align:center;padding:0 8px;position:relative}
.tl-d{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;background:var(--bg);border:3px solid var(--sky);display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:18px;color:var(--sky);position:relative}
.tl-i:last-child .tl-d{border-color:var(--wa);color:var(--wa)}
.tl-i h3{margin:0 0 4px;font-size:15px}
.tl-i p{margin:0;font-size:13px;color:var(--muted)}
.wa-demo{margin-top:36px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.msg{background:var(--sky-pale);border:1px solid var(--line);border-radius:14px;padding:18px}
.msg .bub{background:#dcf8c6;color:#0c2a3e;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;max-width:46ch}
.msg h3{margin:0;font-size:16px}

/* structure */
.tree{display:flex;flex-direction:column;align-items:center;gap:0}
.node{background:var(--bg);border:2px solid var(--sky);border-radius:14px;padding:14px 20px;text-align:center;min-width:0}
.node b{display:block;font-size:17px}.node span{color:var(--muted);font-size:13px}
.root{background:var(--sky);color:#fff;border-color:var(--sky)}.root span{color:#e3f4fd}
.vline{width:3px;height:26px;background:var(--sky)}
.coachs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;position:relative;padding-top:26px}
.coachs::before{content:"";position:absolute;top:0;left:16.6%;right:16.6%;height:3px;background:var(--sky)}
.coach{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.coach::before{content:"";position:absolute;top:-26px;width:3px;height:26px;background:var(--sky)}
.studs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.stud{background:var(--sky-soft);color:var(--sky-d);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:32px}
.rule{border-inline-start:3px solid var(--sky);padding:4px 14px}
.rule h3{margin:0 0 4px;font-size:16px}.rule p{margin:0;color:var(--muted);font-size:14px}

/* features */
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.f{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--bg)}
.f .ico{width:42px;height:42px;border-radius:10px;background:var(--sky-soft);color:var(--sky);display:grid;place-items:center;margin-bottom:12px}
.f h3{margin:0 0 6px;font-size:17px}.f p{margin:0;color:var(--muted);font-size:15px}

/* compare */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{padding:14px 16px;border-bottom:1px solid var(--line);text-align:start}
th{background:var(--sky-pale);font-size:13px;color:var(--muted)}
th.me{background:var(--sky);color:#fff}
td.me{background:var(--sky-soft);font-weight:800;color:var(--sky-d)}
td.n{color:var(--bad)}
tr:last-child td{border-bottom:0}

/* pricing */
.prices{display:grid;grid-template-columns:1fr;gap:20px;max-width:440px;margin-inline:auto}
.price{border:1px solid var(--line);border-radius:18px;padding:28px;background:var(--bg);display:flex;flex-direction:column;gap:12px;position:relative}
.price.hot{border:2px solid var(--sky);box-shadow:0 20px 50px #0b8fd626}
.badge{position:absolute;top:-13px;inset-inline-start:24px;background:var(--sky);color:#fff;font-weight:800;font-size:12px;padding:4px 12px;border-radius:999px}
.price h3{margin:0;font-size:22px}
.price .for{color:var(--muted);margin:0}
.amt{font-family:var(--f-d);font-size:64px;font-weight:800;line-height:1}
.amt small{font-family:var(--f-b);font-size:16px;color:var(--muted);font-weight:600}
[dir="rtl"] .amt small{font-family:var(--f-a)}
.ck{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.ck li{display:flex;gap:10px}
.ck li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;background:var(--sky-soft);color:var(--sky);display:grid;place-items:center;font-weight:800;font-size:12px}
.price .btn{margin-top:auto}
.yr{margin-top:18px;color:var(--muted)}

/* faq */
.faq{max-width:820px;display:flex;flex-direction:column;gap:10px}
details{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 18px}
summary{cursor:pointer;font-weight:800;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::after{content:"+";color:var(--sky);font-size:22px;line-height:1}
details[open] summary::after{content:"−"}
details p{margin:0 0 16px;color:var(--muted)}

/* final cta + footer */
.final{background-color:#0b8fd6;background-image:var(--zel);color:#fff;text-align:center}
.final h2{color:#fff}.final .lead{color:#eef8ff;margin-inline:auto}
.final .cta{justify-content:center}
.contacts{margin-top:18px;color:#e3f4fd;font-weight:600}
footer{background:#0c2a3e;color:#b9d6e8;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:14px}
footer .w{display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;align-items:center}
footer button{background:none;border:0;color:#fff;cursor:pointer;text-decoration:underline;padding:0;font-weight:600}
.fl{display:flex;gap:16px;flex-wrap:wrap}

.fab{position:fixed;z-index:30;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-end:calc(20px + env(safe-area-inset-right,0px));width:60px;height:60px;border-radius:50%;background:var(--wa);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px #1fa85566;animation:ring 3s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 10px 30px #1fa85566}50%{box-shadow:0 0 0 12px #1fa85522,0 10px 30px #1fa85566}}

  <div class="tl">${t.tl.map(x=>`<div class="tl-i rv"><div class="tl-d num">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join("")}</div>
  <div class="wa-demo">
    <div class="msg rv"><h3>${t.m1h}</h3><div class="bub">${t.m1}</div></div>
    <div class="msg rv"><h3>${t.m2h}</h3><div class="bub">${t.m2}</div></div>
  </div>
</div></section>

<section class="band pale"><div class="w">
  <div class="eyebrow rv">${t.stE}</div><h2 class="rv">${t.stT}</h2><p class="lead rv">${t.stL}</p>
  <div class="tree rv">
    <div class="node root"><b>${t.tree.salle[0]}</b><span>${t.tree.salle[1]}</span></div>
    <div class="vline"></div>
    <div class="coachs">${t.tree.coachs.map(c=>`<div class="coach"><div class="node"><b>${c[0]}</b><span>${c[1]}</span></div><div class="studs">${c[2].map(s=>`<span class="stud">${s}</span>`).join("")}</div></div>`).join("")}</div>
  </div>
  <div class="rules">${t.rules.map(r=>`<div class="rule rv"><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join("")}</div>
</div></section>

<section class="band"><div class="w">
  <div class="eyebrow rv">${t.fE}</div><h2 class="rv">${t.fT}</h2>
  <div class="feat">${t.feats.map((f,i)=>`<div class="f rv"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">${ICONS[i]}</svg></div><h3>${f[0]}</h3><p>${f[1]}</p></div>`).join("")}</div>
</div></section>

<section class="band pale"><div class="w">
  <div class="eyebrow rv">${t.cE}</div><h2 class="rv">${t.cT}</h2>
  <div class="tw rv"><table><thead><tr>${t.cmp.h.map((h,i)=>`<th class="${i===3?"me":""}">${h}</th>`).join("")}</tr></thead>
  <tbody>${t.cmp.r.map(r=>`<tr>${r.map((c,i)=>`<td class="${i===3?"me":(/^(Non|No|لا)$/.test(c)?"n":"")}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
</div></section>

<section class="band" id="tarifs"><div class="w">
  <div class="eyebrow rv">${t.prE}</div><h2 class="rv">${t.prT}</h2><p class="lead rv">${t.prL}</p>
  <div class="prices">${t.plans.map(p=>`<div class="price rv ${p[4]?"hot":""}">${p[4]?`<span class="badge">${p[4]}</span>`:""}<h3>${p[0]}</h3><p class="for">${p[1]}</p><div class="amt num"><span data-count="${p[2]}">${p[2]}</span> <small>${t.per}</small></div><ul class="ck">${p[3].map(x=>`<li>${x}</li>`).join("")}</ul><a class="btn ${p[4]?"btn-s":"btn-w"}" style="${p[4]?"":"border-color:var(--sky);color:var(--sky);background:transparent"}" href="${DEMO}?signup" target="_blank" rel="noopener">${t.go}</a></div>`).join("")}</div>
  <p class="yr">${t.yr}</p>
</div></section>

<section class="band pale" id="faq"><div class="w">
  <div class="eyebrow rv">${t.qE}</div><h2 class="rv">${t.qT}</h2>
  <div class="faq">${t.faq.map((q,i)=>`<details class="rv" ${i===0?"open":""}><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join("")}</div>
</div></section>

<section class="band final"><div class="w">
  <h2 class="rv">${t.fnT}</h2><p class="lead rv">${t.fnL}</p>
  <div class="cta rv"><a class="btn btn-wa" href="${waURL()}" target="_blank" rel="noopener">${waIco} ${t.wa}</a></div>
  <p class="contacts num">WhatsApp ${CONTACT.waShow} · ${CONTACT.mail}</p>
</div></section>

<footer><div class="w"><span>${t.foot}</span><div class="fl">${t.pol.map((p,i)=>`<button data-pol="${i}">${p}</button>`).join("")}</div></div></footer>
<a class="fab" href="${waURL()}" target="_blank" rel="noopener" aria-label="WhatsApp">${waIco.replace('width="20" height="20"','width="30" height="30"')}</a>`;
  reveal();
}

let io;
function reveal(){
  if(io)io.disconnect();
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const els=[...document.querySelectorAll(".rv")];
  if(reduce||!("IntersectionObserver" in window))return;
  const vh=innerHeight;
  els.forEach(el=>{if(el.getBoundingClientRect().top>vh*0.95)el.classList.add("wait")});
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove("wait");e.target.querySelectorAll("[data-count]").forEach(count);io.unobserve(e.target)}}),{threshold:.15});
  els.forEach(el=>io.observe(el));
}
function count(el){
  if(el.dataset.done)return;el.dataset.done=1;
  const end=+el.dataset.count,t0=performance.now(),d=1200;
  const step=n=>{const p=Math.min(1,(n-t0)/d);el.textContent=Math.round(end*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-lang],[data-pol],[data-close]");if(!b)return;
  if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem("sp_lang",lang)}catch(_){}render();return}
  if(b.dataset.close!==undefined){document.getElementById("ov")?.remove();return}
  const p=L[lang].policies[+b.dataset.pol];
  const ov=document.createElement("div");ov.className="ov";ov.id="ov";
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><button class="close" data-close aria-label="${L[lang].close}">×</button><h3>${p[0]}</h3>${p[1].map(s=>`<h4>${s[0]}</h4><p>${s[1]}</p>`).join("")}</div>`;
  ov.addEventListener("click",ev=>{if(ev.target===ov)ov.remove()});
  document.body.appendChild(ov);ov.querySelector(".close").focus();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("ov")?.remove()});
addEventListener("scroll",()=>document.getElementById("top")?.classList.toggle("sh",scrollY>10),{passive:true});
render();
</script>

</body></html>
